name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, for example v1.2.3"
        required: true
        type: string
      commit:
        description: "Commit SHA on master to release; defaults to master HEAD"
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - "*"

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout master
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout release ref
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Save GoReleaser config
        run: cp .goreleaser.yml "${RUNNER_TEMP}/goreleaser.yml"

      - name: Set release tag from pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          echo "GORELEASER_CURRENT_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
        env:
          TAG: ${{ github.event.inputs.tag }}
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          git fetch --force origin master:refs/remotes/origin/master --tags

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TARGET_COMMIT="${COMMIT:-origin/master}"
            if ! RELEASE_COMMIT="$(git rev-parse --verify "${TARGET_COMMIT}^{commit}")"; then
              echo "::error::Commit ${TARGET_COMMIT} was not found."
              exit 1
            fi

            if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/master; then
              echo "::error::Commit ${RELEASE_COMMIT} is not on master."
              exit 1
            fi

            git checkout --detach "${RELEASE_COMMIT}"
          else
            RELEASE_COMMIT="$(git rev-parse HEAD)"
          fi

          if [ -z "${TAG}" ]; then
            TAG="$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" --points-at "${RELEASE_COMMIT}" --sort=-v:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1 || true)"
          fi

          if [ -z "${TAG}" ]; then
            LATEST_TAG="$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" --merged "${RELEASE_COMMIT}" --sort=-v:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1 || true)"
            if [ -z "${LATEST_TAG}" ]; then
              TAG="v0.1.0"
            elif [[ "${LATEST_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              TAG="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "::error::Latest release tag ${LATEST_TAG} is not a vX.Y.Z tag."
              exit 1
            fi
          fi

          if git rev-parse --quiet --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${TAG}")"
            if [ "${TAG_COMMIT}" != "${RELEASE_COMMIT}" ]; then
              echo "::error::Tag ${TAG} points to ${TAG_COMMIT}, but the selected release commit is ${RELEASE_COMMIT}."
              echo "::error::Delete and recreate the tag, select ${TAG_COMMIT}, or use a new tag."
              exit 1
            fi

            echo "Tag ${TAG} already points to ${RELEASE_COMMIT}; continuing."
          else
            git tag -- "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "GORELEASER_CURRENT_TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Verify release tag
        run: |
          TAG="${RELEASE_TAG:?Release tag was not set.}"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${TAG}")"

          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "::error::Tag ${TAG} points to ${TAG_COMMIT}, but HEAD is ${HEAD_COMMIT}."
            exit 1
          fi

      - name: Fetch Go version
        run: |
          GO_VERSION=$(perl -ne 'print "$1\n" if /FROM golang:([0-9.]+)/' Dockerfile | head -n1)
          [ -n "$GO_VERSION" ] || exit 1
          echo "go_version=$GO_VERSION" >> $GITHUB_ENV

      - name: Setup Go environment
        uses: actions/setup-go@v6.1.0
        with:
          go-version: "${{ env.go_version }}"

      - name: Binaries Release
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          version: ~> 2.7.0
          args: release --clean --config=${{ runner.temp }}/goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
